#Better Zoom Configuration
#The zoom increment step per zoom in/out (higher values zoom/dezoom faster)
#Range: 1 ~ 20
zoomStep = 5
#Mouse sensitivity multiplier while zooming (lower values make it less sensitive)
#Range: 0.01 ~ 1.0
zoomSensitivity = 0.01
#Adjusts mouse sensitivity based on the zoom level
autoAdjustSensitivity = true
#Require holding the zoom key
holdToZoom = true
#Speed of zoom transitions (higher = faster/less smooth, lower = slower/more smooth)
#Range: 0.05 ~ 0.25
smoothEasingFactor = 0.2
#Enable smooth zooming transitions (ease in/out)
smoothZoom = true
#Zoom adjustment mode
#Allowed Values: WHEEL, HOTKEYS, BOTH
zoomMode = "BOTH"
#Disables bobbing/bob view while zooming to prevent visual wobble
disableBobbing = true
#Enable cinematic camera movement while zooming
cinematicCamera = false
#Play the spyglass sound when zooming/unzooming
zoomSound = true
#Hide the GUI while zooming
hideGui = true
#Hide your hand while zooming
hideHand = false
#Show black bars at the top and bottom while zooming
cinematicBars = false
#Show the zoom level (like x2.5) while zooming
zoomLevel = false
#Show how to open these settings on the first zoom of each join
settingsHint = true

